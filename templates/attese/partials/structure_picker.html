{% load i18n %}<label class="form-label fw-semibold">{% translate "Struttura" %}</label>
<select name="structure_id"
        class="form-select"
        hx-get="{% url 'structure_chart_partial' %}"
        hx-target="#structure-chart-area"
        hx-include="[name='activity_code']"
        hx-indicator="#spinner-struct"
        hx-trigger="change">
  <option value="">{% translate "— Seleziona una struttura —" %}</option>
  {% for s in structures %}
    <option value="{{ s.pk }}">{{ s.description }}</option>
  {% endfor %}
</select>
