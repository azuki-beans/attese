{% load i18n %}{% if labels != "[]" %}
<p class="text-muted small mb-2">
  <i class="bi bi-hospital me-1"></i>{{ structure_label }} &mdash; {{ activity_label }}
</p>
<div class="chart-container">
  <canvas id="structureChart"
          data-chart="1"
          data-labels="{{ labels }}"
          data-data="{{ data }}"
          data-chart-label="{{ activity_label }} – {{ structure_label }}">
  </canvas>
</div>
{% else %}
<p class="text-muted text-center py-3">{% translate "Nessun dato disponibile per questa combinazione." %}</p>
{% endif %}
