{% regroup current_activities by lettera as letters %}
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
  {% for letter in letters %}
    <div class="col">
      <div class="fw-bold text-success border-bottom mb-1">{{ letter.grouper }}</div>
      <ul class="list-unstyled small mb-0">
        {% for a in letter.list %}
          <li class="py-1">
            <a href="{% url 'activity_detail' a.activity_code a.slug %}" class="text-decoration-none">
              {{ a.nome }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endfor %}
</div>
