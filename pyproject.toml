[tool.poetry]
name = "attese"
version = "0.1.0"
description = "South Tyrol health services waiting times dashboard"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
Django = "~6.0.8"
psycopg = {version = "^3.3.4", extras = ["binary", "pool"]}
django-allauth = {version = "^65.18.0", extras = ["socialaccount"]}
django-htmx = "^1.27.0"
whitenoise = "^6.12.0"
gunicorn = "^26.0.0"
celery = {version = "^5.6.3", extras = ["redis"]}
redis = ">=4.5.2,<6.5"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
django-debug-toolbar = "^6.3.0"
pre-commit = "^4.6.0"
detect-secrets = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# RUF012: Meta/admin di Django usano liste e tuple come attributi di classe
extend-ignore = ["RUF012"]
