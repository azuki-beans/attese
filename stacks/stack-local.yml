name: attese

x-common-variables: &common-env
  # Django
  SECRET_KEY: django-insecure-local-dev-only
  ALLOWED_HOSTS: localhost,127.0.0.1
  DEBUG: 1

  # Database
  POSTGRES_DB: attese
  POSTGRES_USER: attese
  POSTGRES_PASSWORD: attese
  POSTGRES_HOST: db

  # Auth Google
  SOCIALACCOUNT_ONLY: 1
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

  # Email (Mailpit in locale)
  EMAIL_BACKEND: smtp
  EMAIL_HOST: mailpit
  EMAIL_PORT: 1025
  DEFAULT_FROM_EMAIL: noreply@attese.local

  # App
  SITE_URL: http://localhost:8000
  CSRF_TRUSTED_ORIGINS: http://localhost:8000

  # Celery
  CELERY_BROKER_URL: redis://redis:6379/0

services:
  db:
    image: postgres:18.3
    volumes:
      - attese_data:/var/lib/postgresql
    environment: *common-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attese"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    environment: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ..:/app
    environment: *common-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ..:/app
    environment: *common-env
    depends_on:
      - celery

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  attese_data:
